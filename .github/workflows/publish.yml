name: publish

# How to release: bump version in package.json, create a GitHub Release
# with tag v<version> (e.g. v0.1.0), this workflow publishes to npm.
# One-time setup at npmjs.com: package settings > Trusted Publisher >
# GitHub Actions (org/repo: notoofly/elysia-rack, workflow: publish.yml).
# Alternative: fill the NPM_TOKEN secret and add
#   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# to the publish step.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:assets
      - run: bun test --coverage
      - run: bun run build
      - name: check release tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ github.event.release.tag_name }}" ]; then
            echo "tag ${{ github.event.release.tag_name }} != package version $pkg"
            exit 1
          fi
      - run: npm publish --provenance --access public
